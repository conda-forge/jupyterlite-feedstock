# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.8.6"
  python_check_max: "3.14"

package:
  name: jupyterlite
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/j/jupyterlite/jupyterlite-${{ version }}.tar.gz
  sha256: c8b14749b2f419defd9769773616ab6a26b262071d0c02301f0e54525663bdf2

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  host:
    - hatchling >=1.6.3,<2
    - pip
    - python ${{ python_min }}.*
  run:
    - jupyterlite-core ${{ version }}.*
    - python >=${{ python_min }}

tests:
  - package_contents:
      strict: true
      site_packages:
        - jupyterlite/**
        - jupyterlite-${{ version }}.dist-info/**
  - python:
      imports: jupyterlite
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - python ${{ python_min }}.*
    script:
      - jupyter lite --help
      - jupyter lite --version
      - jupyter lite --version | ${{ "grep -iE " if unix else "findstr /r /c:"}}${{ version | replace(".", "\.") }}

about:
  summary: JupyterLite metapackage
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/jupyterlite
  repository: https://github.com/jupyterlite/jupyterlite
  documentation: https://jupyterlite.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
    - jtpio
    - martinRenou
